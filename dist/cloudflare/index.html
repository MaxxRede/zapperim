<!doctype html>
<html lang="pt-BR"><head><base target="_top"><meta charset="utf-8"><title>ZAPerim • Pedidos</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#262626;background:#faf8f6;--orange:#fb7915;--line:#e7e0db}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.top{background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px max(18px,calc((100vw - 1250px)/2));gap:16px}.brand{font-weight:900;color:var(--orange);font-size:23px}.brand span{color:#4b4b4b}nav{display:flex;gap:7px;flex-wrap:wrap}nav button,.secondary,.link{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;color:#3d3d3d}nav button.active{background:var(--orange);color:#fff;border-color:var(--orange)}main{max-width:1250px;margin:auto;padding:22px 18px 90px}.panel,.card,.client{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 6px #25190808}.panel{padding:24px}.narrow{max-width:540px;margin:32px auto}h1{font-size:25px;margin:0 0 8px}h2{font-size:20px}p{color:#685f59;line-height:1.5}label{display:block;font-size:14px;margin:14px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;background:#fff;color:#222;margin-top:5px}input:focus,select:focus,textarea:focus{outline:2px solid var(--orange)}.primary{background:var(--orange);border:1px solid var(--orange);color:white;border-radius:10px;padding:12px 18px;font-weight:700}.narrow form>.primary{width:100%;margin-top:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}.full{grid-column:1/-1}.formgrid .primary{width:100%}.link{border:0;color:#cf5a00;margin-top:10px}.client{padding:12px 16px;margin-bottom:18px;color:#57504b}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:16px 0}.toolbar label{flex:1;min-width:150px;margin:0}.toolbar select{min-width:150px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{overflow:hidden;display:flex;flex-direction:column}.card img{width:100%;height:205px;object-fit:contain;background:white}.card .body{padding:12px;display:flex;flex-direction:column;gap:9px;flex:1}.card h3{font-size:14px;min-height:40px;margin:0}.muted{font-size:12px;color:#746e68}.price{color:#e56300;font-weight:750}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.card input[type=number]{max-width:78px;margin:0;padding:8px}.card button{padding:9px}.paging{display:flex;justify-content:center;align-items:center;gap:14px;margin:24px}.client strong{color:#252525}.items{list-style:none;padding:0}.items li{padding:11px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between}.items input{width:85px;margin:0}.error{color:#9c2700;background:#ffefe6;border:1px solid #f7c4a9;padding:12px;border-radius:9px;margin-bottom:14px}.success{color:#115132;background:#e8f7ed;border:1px solid #a9d4b6;padding:12px;border-radius:9px;margin-bottom:14px}.overlay{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:14px}.overlay[hidden]{display:none}.overlay .panel{width:min(100%,480px);max-height:90vh;overflow:auto}.pill{background:#fff2e7;color:#b75000;border-radius:20px;padding:5px 9px;font-size:12px}.summary{border:1px solid #ffd1ad;border-radius:10px;background:#fff4eb;padding:14px;margin:14px 0}button:focus-visible{outline:3px solid #333} [hidden]{display:none!important}@media(max-width:650px){.top{display:block}.top nav{margin-top:10px}nav button{flex:1;font-size:12px;padding:9px 4px}.formgrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card img{height:145px}.card h3{font-size:12px}.items li{align-items:start;flex-wrap:wrap}.toolbar{display:block}.toolbar label{margin:10px 0}}
</style></head><body>
<header class="top"><div class="brand">ZAP<span>erim</span></div><nav id="nav" hidden><button data-page="favoritos">♡ Queridinhos</button><button data-page="catalogo">Catálogo</button><button data-page="pedido">Pedido <span id="badge">0</span></button><button data-page="historico">Meus pedidos</button><button id="logout">Sair</button></nav></header>
<main>
  <div id="notice" role="status" aria-live="polite"></div>
  <section id="entry" class="panel narrow"><h1>Acesse com seu CNPJ</h1><p>Digite os 14 dígitos para começar.</p><form id="cnpjForm"><label>CNPJ<input name="cnpj" inputmode="numeric" required placeholder="00.000.000/0000-00" maxlength="18" autocomplete="off"></label><button class="primary">Entrar</button></form></section>
  <section id="register" class="panel narrow" hidden><h1>Novo cadastro</h1><p>O cadastro ficará pendente de análise comercial.</p><form id="registerForm" class="formgrid">
    <label class="full">Nome ou razão social *<input name="nome" required maxlength="140"></label>
    <label>Telefone com DDD *<input name="telefone" type="tel" required inputmode="tel"></label><label>E-mail *<input name="email" type="email" required></label>
    <label class="full">Endereço completo *<input name="endereco" required maxlength="180"></label>
    <label>Cidade *<input name="cidade" required></label><label>UF *<select name="uf" required><option value="">Selecione</option></select></label>
    <label>CEP *<input name="cep" inputmode="numeric" required maxlength="9"></label><label>Complemento<input name="complemento"></label>
    <label>Responsável *<input name="responsavel" required></label><label>Cargo *<input name="cargo" required></label>
    <button class="primary full">Enviar cadastro</button></form><button class="link back">Voltar</button></section>
  <section id="emailStep" class="panel narrow" hidden><h1>Confirme seu contato</h1><p id="emailHelp"></p><form id="emailForm"><label>E-mail cadastrado<input name="email" type="email" required autocomplete="email"></label><button class="primary">Enviar código</button></form><button class="link back">Voltar</button></section>
  <section id="verify" class="panel narrow" hidden><h1>Código de acesso</h1><p>Informe o código recebido por e-mail. Ele vence em 10 minutos.</p><form id="verifyForm"><label>Código de 6 dígitos<input name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autocomplete="one-time-code"></label><button class="primary">Confirmar</button></form><button id="resend" class="link">Reenviar código</button></section>
  <section id="confirm" class="panel narrow" hidden><h1>Confirme seus dados</h1><p id="confirmName"></p><form id="confirmForm"><label>E-mail cadastrado<input name="email" disabled></label><label>Telefone com DDD *<input name="telefone" type="tel" required></label><label>Responsável *<input name="responsavel" required></label><label>Cargo *<input name="cargo" required></label><button class="primary">Continuar</button></form></section>
  <section id="shop" hidden><div class="client" id="client"></div><div id="page"></div></section>
</main><div id="modal" class="overlay" hidden></div>
<script>
(() => {
  'use strict';
  const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format((Number(n)||0)/100);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const state={cnpj:'',email:'',token:sessionStorage.getItem('zap_token')||'',profile:null,page:'favoritos',current:1,
    search:'',brand:'',stock:false,cart:new Map(),requestId:null};
  function rpc(method,...args){return new Promise((resolve,reject)=>fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:method,args})}).then(async response=>{const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'Falha de comunicação.');return data.result;}).then(resolve,reject));}
  function notice(message,error=false){const n=$('#notice');n.textContent=message||'';n.className=message?(error?'error':'success'):'';if(message) window.scrollTo({top:0,behavior:'smooth'});}
  function section(id){['entry','register','emailStep','verify','confirm','shop'].forEach(x=>$('#'+x).hidden=x!==id);notice('');}
  function busy(form,on){const b=form.querySelector('button[type=submit],button.primary');if(b)b.disabled=on;}
  async function run(form,action){busy(form,true);try{await action();}catch(e){notice(e.message||String(e),true);}finally{busy(form,false);}}
  function updateBadge(){ $('#badge').textContent=[...state.cart.values()].filter(x=>x.quantidade>0).length; }
  function saveCart(){sessionStorage.setItem('zap_cart_'+state.cnpj,JSON.stringify([...state.cart.values()]));updateBadge();}
  function setQty(product,qty){qty=Number(qty);if(!Number.isSafeInteger(qty)||qty<0||qty>10000){notice('Quantidade inválida.',true);return;}
    if(qty>Number(product.estoque)){notice('Quantidade acima do estoque disponível.',true);return;}
    if(qty)state.cart.set(product.codigo,{...product,quantidade:qty});else state.cart.delete(product.codigo);
    state.requestId=null;saveCart();notice(qty?'Produto atualizado no pedido.':'Produto removido.');}
  function showShop(){section('shop');$('#nav').hidden=false;$('#client').innerHTML=`<strong>${esc(state.profile.nome)}</strong> · CNPJ ${esc(state.profile.cnpj)} · ${esc(state.profile.uf)} · ${esc(state.profile.tipo==='PENDENTE'?'Cadastro em análise':'Cliente cadastrado')}`;renderPage();}
  function confirmOrShop(){if(state.profile.tipo==='EXISTENTE'){$('#confirmName').textContent=state.profile.nome+' · '+state.profile.cnpj;
      const f=$('#confirmForm');f.elements.email.value=state.profile.email;f.elements.telefone.value=state.profile.telefone;
      f.elements.responsavel.value=state.profile.responsavel;f.elements.cargo.value=state.profile.cargo;
      section('confirm');}else showShop();}
  function safeImage(url){return /^https:\/\/[^\s"<>]+$/i.test(String(url))?url:'';}
  function productCard(p){const src=safeImage(p.imagem), qty=state.cart.get(p.codigo)?.quantidade||0;
    return `<article class="card"><img src="${esc(src)}" alt="${esc(p.descricao)}" loading="lazy" onerror="this.style.visibility='hidden'"><div class="body"><span class="muted">${esc(p.marca)} · ${esc(p.codigo)}</span><h3>${esc(p.descricao)}</h3><div class="row"><span class="price">${money(p.precoCentavos)}</span><span class="pill">${Number(p.vendidos)||0} vendidos</span></div><span class="muted">Estoque: ${Number(p.estoque)||0}</span><div class="row"><label>Qtd <input type="number" min="1" max="${Number(p.estoque)||0}" value="${qty||1}" data-qty="${esc(p.codigo)}"></label><button class="primary" data-add="${esc(p.codigo)}" ${p.estoque<=0?'disabled':''}>Adicionar</button></div></div></article>`;}
  let visible=new Map();
  async function renderPage(){const page=state.page;document.querySelectorAll('nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
    const root=$('#page');root.innerHTML='<p>Carregando…</p>';
    try{if(page==='pedido')return await renderOrder();if(page==='historico')return await renderHistory();
      const result=await rpc('listarCatalogo',state.token,{pagina:state.current,busca:state.search,marca:state.brand,somenteEstoque:state.stock,favoritos:page==='favoritos'});
      if(state.page!==page)return;
      visible=new Map(result.itens.map(x=>[x.codigo,x]));
      root.innerHTML=`<h1>${page==='favoritos'?'♡ Os Queridinhos':'Catálogo'}</h1><p>${result.total} produtos · ${result.paginas} páginas</p>
        <div class="toolbar"><label>Pesquisar código, EAN ou nome<input id="search" value="${esc(state.search)}" placeholder="Buscar produtos"></label><label>Marca<select id="brand"><option value="">Todas</option>${result.marcas.map(m=>`<option value="${esc(m)}" ${m===state.brand?'selected':''}>${esc(m)}</option>`).join('')}</select></label><label><input id="stock" type="checkbox" ${state.stock?'checked':''} style="width:auto"> Apenas com estoque</label></div>
        <div class="grid">${result.itens.map(productCard).join('')||'<p>Nenhum produto encontrado.</p>'}</div>
        <div class="paging"><button class="secondary" data-pager="prev" ${result.pagina<=1?'disabled':''}>Anterior</button><span>${result.pagina} / ${result.paginas||1}</span><button class="secondary" data-pager="next" ${result.pagina>=result.paginas?'disabled':''}>Próxima</button></div>`;
    }catch(e){root.textContent='Erro: '+(e.message||String(e));}}
  async function renderOrder(){const root=$('#page'), items=[...state.cart.values()];
    const sum=items.reduce((n,x)=>n+x.precoCentavos*x.quantidade,0);
    root.innerHTML=`<h1>Pedido</h1><p>Valores e estoque serão conferidos novamente ao concluir.</p>
      <details class="panel"><summary>Pedido dinâmico: digite códigos separados por espaço ou vírgula</summary><label>Códigos<textarea id="codes" rows="3"></textarea></label><button id="lookup" class="secondary">Localizar códigos</button><div id="found"></div></details>
      <div class="panel" style="margin-top:12px"><h2>Itens (${items.length})</h2><ul class="items">${items.map(x=>`<li><div><strong>${esc(x.codigo)}</strong> · ${esc(x.descricao)}<br><span class="muted">${money(x.precoCentavos)} cada</span></div><label>Qtd<input type="number" min="0" max="${Number(x.estoque)}" value="${x.quantidade}" data-cartqty="${esc(x.codigo)}"></label><b>${money(x.precoCentavos*x.quantidade)}</b><button class="secondary" data-remove="${esc(x.codigo)}" aria-label="Remover ${esc(x.codigo)}">×</button></li>`).join('')||'<li>O pedido está vazio. Adicione produtos pelo catálogo.</li>'}</ul><div class="summary row"><strong>Subtotal</strong><strong>${money(sum)}</strong></div>
      <label>Condição de pagamento<input value="${esc(state.profile.condicao)}" disabled></label><label>Observações<textarea id="notes" rows="3" maxlength="1000"></textarea></label><button id="finish" class="primary" ${items.length?'':'disabled'}>Concluir pedido</button></div>`;
    const top=await rpc('topDez',state.token);if(state.page!== 'pedido')return;
    visible=new Map(top.map(x=>[x.codigo,x]));root.insertAdjacentHTML('beforeend',`<div class="panel" style="margin-top:12px"><h2>Top 10 mais vendidos</h2><div class="grid">${top.map(productCard).join('')}</div></div>`);
  }
  async function renderHistory(){const root=$('#page');try{const rows=await rpc('meusPedidos',state.token);if(state.page!=='historico')return;
    root.innerHTML=`<h1>Meus pedidos</h1><div class="panel"><ul class="items">${rows.map(x=>`<li><strong>${esc(x.id)}</strong><span>${esc(x.criadoEm)}</span><span>${esc(x.status)}</span><strong>${money(x.totalCentavos)}</strong></li>`).join('')||'<li>Nenhum pedido registrado.</li>'}</ul></div>`;
  }catch(e){root.textContent=e.message||String(e);}}
  let timer;
  $('#cnpjForm').addEventListener('submit',e=>{e.preventDefault();run(e.target,async()=>{const c=$('#cnpjForm [name=cnpj]').value;const r=await rpc('identificarCnpj',c);state.cnpj=r.cnpj;
    if(r.tipo==='NOVO'){section('register');}else{section('emailStep');$('#emailHelp').textContent=r.tipo==='PENDENTE'?'Seu cadastro aguarda análise. Informe o e-mail utilizado.':'Informe o e-mail cadastrado.';}});});
  $('#registerForm').addEventListener('submit',e=>{e.preventDefault();run(e.target,async()=>{const d=Object.fromEntries(new FormData(e.target));d.cnpj=state.cnpj;d.seller=new URLSearchParams(location.search).get('seller')||'';
    const r=await rpc('cadastrarCliente',d);state.email=d.email;section('verify');notice(r.mensagem);});});
  $('#emailForm').addEventListener('submit',e=>{e.preventDefault();run(e.target,async()=>{state.email=e.target.elements.email.value;const r=await rpc('solicitarCodigo',state.cnpj,state.email);section('verify');notice(r.mensagem);});});
  $('#verifyForm').addEventListener('submit',e=>{e.preventDefault();run(e.target,async()=>{const r=await rpc('confirmarCodigo',state.cnpj,state.email,e.target.elements.code.value);state.token=r.token;state.profile=r.cliente;sessionStorage.setItem('zap_token',r.token);
    try{state.cart=new Map(JSON.parse(sessionStorage.getItem('zap_cart_'+state.cnpj)||'[]').map(x=>[x.codigo,x]));}catch(_){state.cart=new Map();}updateBadge();confirmOrShop();});});
  $('#confirmForm').addEventListener('submit',e=>{e.preventDefault();run(e.target,async()=>{const f=e.target;state.profile=await rpc('confirmarDados',state.token,{telefone:f.elements.telefone.value,responsavel:f.elements.responsavel.value,cargo:f.elements.cargo.value});showShop();});});
  $('#resend').addEventListener('click',()=>run($('#verifyForm'),async()=>{const r=await rpc('solicitarCodigo',state.cnpj,state.email);notice(r.mensagem);}));
  document.querySelectorAll('.back').forEach(b=>b.addEventListener('click',()=>section('entry')));
  $('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b){state.page=b.dataset.page;state.current=1;state.search='';state.brand='';renderPage();}});
  $('#logout').addEventListener('click',async()=>{try{await rpc('sair',state.token);}catch(_){}sessionStorage.removeItem('zap_token');state.token='';state.profile=null;state.cart.clear();$('#nav').hidden=true;section('entry');});
  $('#page').addEventListener('input',e=>{if(e.target.id==='search'){clearTimeout(timer);const v=e.target.value;timer=setTimeout(()=>{state.search=v;state.current=1;renderPage();},400);}});
  $('#page').addEventListener('change',e=>{if(e.target.id==='brand'){state.brand=e.target.value;state.current=1;renderPage();}if(e.target.id==='stock'){state.stock=e.target.checked;state.current=1;renderPage();}
    if(e.target.matches('[data-cartqty]')){const x=state.cart.get(e.target.dataset.cartqty);if(x){setQty(x,e.target.value);renderOrder();}}});
  $('#page').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.pager){state.current+=b.dataset.pager==='next'?1:-1;renderPage();return;}
    if(b.dataset.add){const p=visible.get(b.dataset.add);const q=b.closest('.card').querySelector('input[data-qty]');if(p)setQty(p,q.value);return;}
    if(b.dataset.remove){state.cart.delete(b.dataset.remove);state.requestId=null;saveCart();renderOrder();return;}
    if(b.id==='lookup'){b.disabled=true;try{const r=await rpc('pedidoDinamico',state.token,$('#codes').value);r.encontrados.forEach(x=>visible.set(x.codigo,x));
      $('#found').innerHTML=`<p>${r.naoEncontrados.length?'Não encontrados: '+esc(r.naoEncontrados.join(', ')):''}</p><div class="grid">${r.encontrados.map(productCard).join('')}</div>`;
    }catch(err){notice(err.message,true);}finally{b.disabled=false;}return;}
    if(b.id==='finish'){b.disabled=true;try{state.requestId=state.requestId||crypto.randomUUID();const r=await rpc('concluirPedido',state.token,{requisicaoId:state.requestId,condicao:state.profile.condicao,
      itens:[...state.cart.values()].map(x=>({codigo:x.codigo,quantidade:x.quantidade})),observacoes:$('#notes').value});
      state.cart.clear();saveCart();state.requestId=null;state.page='historico';await renderPage();notice('Pedido '+r.pedidoId+' registrado com status '+r.status+'.');
    }catch(err){notice(err.message||String(err),true);}finally{b.disabled=false;}}
  });
  document.querySelector('#register select[name=uf]').insertAdjacentHTML('beforeend','AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ').map(x=>`<option>${x}</option>`).join(''));
  if(state.token)rpc('minhaConta',state.token).then(p=>{state.profile=p;state.cnpj=p.cnpj;try{state.cart=new Map(JSON.parse(sessionStorage.getItem('zap_cart_'+state.cnpj)||'[]').map(x=>[x.codigo,x]));}catch(_){state.cart=new Map();}updateBadge();confirmOrShop();}).catch(()=>{sessionStorage.removeItem('zap_token');section('entry');});
})();
</script></body></html>
